name: Runtime latest (weekly)

# Wave 7 (T82): validate.yml pins the Codex CLI so CI is reproducible. This job installs
# @latest once a week so a new Codex release that changes skill listing shows up here,
# as a FAIL, not as a silent SKIP. A failure opens nothing; read the run.

on:
  schedule:
    - cron: "41 6 * * 1"   # Mondays 06:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  codex-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Codex @latest listing smoke (zero model calls)
        run: |
          npm install -g @openai/codex@latest
          codex --version
          python3 scripts/codex-smoke.py --require --json
